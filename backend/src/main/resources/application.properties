spring.application.name=leavewise
server.port=${PORT:8080}
spring.main.banner-mode=off

# Health endpoint for the host; nothing else is exposed.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=false

# Bundled holiday lists (ADR 0007). Tests point this at fixtures and allow test data.
leavewise.holidays.location=classpath*:holidays/india-*.json
leavewise.holidays.allow-test-data=false

# Abuse limits (docs/API.md, Conventions).
leavewise.rate-limit.requests-per-minute=60
leavewise.rate-limit.burst=20
leavewise.request.max-bytes=32768

# Behind the host's proxy, trust X-Forwarded-For only from it (see docs/DEPLOYMENT.md).
server.forward-headers-strategy=native
# No stack traces or messages in error responses; our handler writes problem+json.
server.error.include-stacktrace=never
server.error.include-message=never

# Privacy (PRD: inputs are not logged): Spring's web loggers can print request and response bodies
# at DEBUG. Pin them so turning on DEBUG elsewhere never logs user input.
logging.level.org.springframework.web=INFO
logging.level.org.springframework.http=INFO
