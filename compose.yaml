# Local run: `docker compose up` (it builds the image each time), then open http://localhost:8080. Stop with `docker compose down`.
# The health check comes from the Dockerfile; settings and their defaults are in docs/DEPLOYMENT.md.
services:
  leavewise:
    build: .
    image: leavewise
    # Build on every `up`, so a plain `docker compose up` never runs a stale image.
    pull_policy: build
    ports:
      - "8080:8080"
    # Same memory as Render's Free plan, so a local run shows how the app behaves in production.
    mem_limit: 512m
    restart: unless-stopped
